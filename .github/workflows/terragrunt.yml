---
name: terragrunt

on:
  push:
    branches:
      - '**'
    tags:
      - 'v?[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  # Scope runs to one account's directory so a stack for another account is
  # never planned or applied with these credentials. Keep in sync with
  # ACCOUNT_LABEL below.
  TG_WORKING_DIR: './deployments/sandbox'
  # State key + provider tags read by root.hcl (matches the local
  # Makefile's `basename $PWD`, so CI and local share one state path).
  REPO_NAME: ${{ github.event.repository.name }}
  # Hub trust model (see hansohn/aws-org-bootstrap): OIDC into this runner role,
  # then chain into the target account's TerraformDeploymentRole. Set per repo
  # as a repo variable (Settings > Secrets and variables > Actions > Variables)
  # so the management account id stays out of source, e.g.
  # arn:aws:iam::<account-id>:role/Org/TerraformRunnerRole
  RUNNER_ROLE_ARN: ${{ vars.RUNNER_ROLE_ARN }}
  # Org account = ORG_PREFIX + the deployments/<label>/ path segment.
  # ORG_PREFIX is your AWS Organizations account-name prefix; set it per repo
  # as a repo variable (Settings > Secrets and variables > Actions > Variables).
  ORG_PREFIX: ${{ vars.ORG_PREFIX }}
  ACCOUNT_LABEL: 'sandbox'
  AWS_REGION: 'us-west-2'

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    container:
      image: hansohn/terraform-aws:latest  # zizmor: ignore[unpinned-images] first-party image, tracks latest tooling
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check terragrunt HCL
        run: 'terragrunt hcl format --check --diff'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: hansohn/terraform-aws:latest  # zizmor: ignore[unpinned-images] first-party image, tracks latest tooling
    needs: [format]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tflint ships with the AWS ruleset baked into the image
      # (checksum-verified, no `tflint --init` / GITHUB_TOKEN required).
      - name: TFLint
        run: 'tflint --recursive'

  plan:
    name: Plan
    permissions:
      contents: read
      id-token: write  # OIDC exchange
    runs-on: ubuntu-latest
    container:
      image: hansohn/terraform-aws:latest  # zizmor: ignore[unpinned-images] first-party image, tracks latest tooling
    needs: [format, lint]
    # Plans take the state lock, so run them one at a time. A newer queued
    # plan replaces an older queued one.
    concurrency:
      group: plan-${{ github.workflow }}
      cancel-in-progress: false
    # Add an `env:` block here to wire any per-repo provider secrets.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to AWS
        uses: ./.github/actions/aws-auth
        with:
          runner-role-arn: ${{ env.RUNNER_ROLE_ARN }}
          account-name: ${{ env.ORG_PREFIX }}${{ env.ACCOUNT_LABEL }}
          aws-region: ${{ env.AWS_REGION }}

      # Terragrunt reads TG_WORKING_DIR from the env (it's the --working-dir
      # flag), so don't also set the step's working-directory — that doubles
      # the path to deployments/deployments.
      - name: Plan
        run: 'terragrunt run --all plan --non-interactive'

  deploy:
    name: Deploy
    permissions:
      contents: read
      id-token: write  # OIDC exchange
    runs-on: ubuntu-latest
    container:
      image: hansohn/terraform-aws:latest  # zizmor: ignore[unpinned-images] first-party image, tracks latest tooling
    needs: [plan]
    # Tag-as-approval: apply only when a version tag is pushed. Branch pushes
    # stop at Plan; pushing `vX.Y.Z` is the deliberate act that rolls out.
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.workflow }}
      cancel-in-progress: false
    # Add an `env:` block here to wire any per-repo provider secrets.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to AWS
        uses: ./.github/actions/aws-auth
        with:
          runner-role-arn: ${{ env.RUNNER_ROLE_ARN }}
          account-name: ${{ env.ORG_PREFIX }}${{ env.ACCOUNT_LABEL }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply
        run: 'terragrunt run --all apply --non-interactive'

  slack:
    name: Slack
    permissions:
      contents: read
      actions: read  # status action queries the run
    runs-on: ubuntu-latest
    # deploy is skipped on branch pushes; always() runs slack regardless, and
    # the status action reads the whole run — so tag runs report post-apply.
    needs: [format, lint, plan, deploy]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Slack Notification
        uses: Gamesight/slack-workflow-status@2e709ce51fd47f02b7221db8547e6e6f49f81f1d  # v2.0.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          channel: ${{ secrets.SLACK_CHANNEL_ID }}
          name: ${{ secrets.SLACK_USERNAME }}
          icon_url: "https://cdn-icons-png.flaticon.com/512/25/25231.png"
